<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair | DevBridge</title><link rel="stylesheet" href="/styles.css"></head><body><main class="phone"><div class="logo">D</div><span class="eyebrow">SECURE TEST SESSION</span><h1>Connect this phone</h1><p class="muted">Receive approved test builds and send feedback to the developer.</p>
<form id="pair-form" class="card stack"><label>Device name<input id="device-name" maxlength="100" required></label><button>Allow connection</button><div id="pair-message" class="message hidden"></div></form>
<section id="phone-workspace" class="hidden"><div class="connected"><span></span>Connected to <strong id="phone-project"></strong></div><article class="card"><span class="eyebrow">AVAILABLE BUILDS</span><div id="phone-builds" class="build-list"></div></article><article class="card"><span class="eyebrow">REPORT A PROBLEM</span><form id="feedback-form" class="stack"><select id="feedback-kind"><option value="bug">Bug</option><option value="ui-change">UI change</option><option value="feature">Feature request</option><option value="performance">Performance</option></select><input id="feedback-screen" placeholder="Screen name (optional)"><textarea id="feedback-message" rows="4" maxlength="4000" placeholder="What happened or what should change?" required></textarea><button>Send to developer</button><div id="feedback-result" class="message hidden"></div></form></article></section>
</main><script src="/pair.js"></script></body></html>
