name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/DevBridge.Server/DevBridge.Server.csproj
      - name: Verify formatting
        run: dotnet format src/DevBridge.Server/DevBridge.Server.csproj --verify-no-changes --no-restore
      - name: Build
        run: dotnet build src/DevBridge.Server/DevBridge.Server.csproj --configuration Release --no-restore
      - name: Validate Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep --stdout > /dev/null
